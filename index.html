<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>África 360 | Premium News Portal</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Inter:wght@300;400;700&family=Merriweather:wght@300;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            /* Palette: Luxury Light (McKinsey Style) */
            --bg: #ffffff;
            --surface: #f8f9fa;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #991b1b; /* Deep Crimson */
            --accent: #1e293b;
            --border: #e2e8f0;
            --card: #ffffff;
            --tag-bg: #f1f5f9;
            --tag-text: #0f172a;
            --font-titles: 'Playfair Display', serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        body.dark-mode {
            /* Palette: Luxury Dark (Midnight Gold) */
            --bg: #020617;
            --surface: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #ef4444;
            --accent: #f1f5f9;
            --border: #1e293b;
            --card: #0f172a;
            --tag-bg: #1e293b;
            --tag-text: #f8fafc;
            --font-titles: 'Merriweather', serif;
            --font-body: 'Inter', sans-serif;
            --shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: var(--font-body); 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Animação de Entrada Notícia */
        .reveal-article { animation: slideUp 0.6s cubic-bezier(0.2, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* Header Premium */
        header { 
            position: sticky; top: 0; z-index: 1000; 
            background: var(--bg); border-bottom: 1px solid var(--border);
            padding: 15px 0; backdrop-filter: blur(10px);
        }
        .nav-container { max-width: 1300px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .logo { font-family: var(--font-titles); font-size: 1.8rem; font-weight: 900; color: var(--text-main); text-decoration: none; letter-spacing: -1px; }
        .logo span { color: var(--primary); }

        /* Luxury Slider (10 Itens) */
        .hero-slider { max-width: 1300px; margin: 20px auto; padding: 0 20px; position: relative; }
        .slider-viewport { overflow: hidden; border-radius: 20px; box-shadow: var(--shadow); height: 450px; position: relative; }
        .slider-track { display: flex; transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1); height: 100%; }
        .slide { min-width: 100%; position: relative; cursor: pointer; overflow: hidden; }
        .slide img { width: 100%; height: 100%; object-fit: cover; transition: transform 2s ease; }
        .slide:hover img { transform: scale(1.05); }
        .slide-content { 
            position: absolute; bottom: 0; left: 0; width: 100%; 
            padding: 60px 40px 40px; 
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            color: white;
        }
        .slide-tag { background: var(--primary); color: white; padding: 5px 12px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; margin-bottom: 15px; display: inline-block; }
        .slide-title { font-family: var(--font-titles); font-size: 2.2rem; line-height: 1.1; max-width: 800px; }

        /* Grid de Notícias */
        .container { max-width: 1300px; margin: 0 auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 35px; margin-top: 40px; }
        .card { 
            background: var(--card); border-radius: 16px; overflow: hidden; 
            transition: all 0.3s ease; border: 1px solid var(--border);
            cursor: pointer; position: relative;
        }
        .card:hover { transform: translateY(-10px); box-shadow: var(--shadow); border-color: var(--primary); }
        .card-img { width: 100%; height: 220px; object-fit: cover; }
        .card-body { padding: 25px; }
        .card-tag { 
            background: var(--tag-bg); color: var(--tag-text); 
            padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; 
            font-weight: 700; margin-bottom: 15px; display: inline-block;
        }
        .card-title { font-family: var(--font-titles); font-size: 1.25rem; font-weight: 700; line-height: 1.4; color: var(--text-main); }

        /* Artigo em Full Screen */
        #article-view { 
            display: none; position: fixed; inset: 0; background: var(--bg); 
            z-index: 2000; overflow-y: auto; padding-top: 0;
        }
        .article-header-nav { 
            position: sticky; top: 0; background: var(--bg); 
            padding: 15px 20px; display: flex; justify-content: space-between; 
            border-bottom: 1px solid var(--border); backdrop-filter: blur(10px);
            z-index: 10;
        }
        .article-hero-img { width: 100%; height: 50vh; object-fit: cover; }
        .article-content-wrap { max-width: 800px; margin: -100px auto 100px; position: relative; background: var(--card); padding: 50px; border-radius: 20px; box-shadow: var(--shadow); }
        .article-title-big { font-family: var(--font-titles); font-size: 3rem; line-height: 1.1; margin-bottom: 30px; }
        .article-text { font-size: 1.15rem; line-height: 1.8; color: var(--text-main); }
        .article-text img { max-width: 100%; border-radius: 10px; margin: 20px 0; }

        /* Botões */
        .btn-round { 
            width: 45px; height: 45px; border-radius: 50%; border: 1px solid var(--border); 
            background: var(--surface); color: var(--text-main); cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.3s;
        }
        .btn-round:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* Search Bar Luxury */
        .search-area { margin: 30px 0; position: relative; }
        .search-area input { 
            width: 100%; padding: 18px 25px 18px 55px; border-radius: 15px;
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text-main); font-size: 1rem; outline: none; transition: 0.3s;
        }
        .search-area i { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-area input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(153, 27, 27, 0.1); }

        @media (max-width: 768px) {
            .slide-title { font-size: 1.5rem; }
            .article-title-big { font-size: 2rem; }
            .article-content-wrap { margin-top: 0; border-radius: 0; padding: 25px; }
            .hero-slider { padding: 0; }
            .slider-viewport { border-radius: 0; height: 350px; }
        }
    </style>
</head>
<body>

<header>
    <div class="nav-container">
        <a href="javascript:void(0)" class="logo" onclick="location.reload()">ÁFRICA<span>360</span></a>
        <div style="display: flex; gap: 10px;">
            <button class="btn-round" onclick="toggleTheme()" title="Trocar Tema">
                <i class="fas fa-moon" id="theme-icon"></i>
            </button>
        </div>
    </div>
</header>

<div id="home-view" class="reveal-article">
    <div class="hero-slider" id="hero-slider">
        <div class="slider-viewport">
            <div class="slider-track" id="slider-track">
                </div>
        </div>
    </div>

    <div class="container">
        <div class="search-area">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" placeholder="Pesquisar análises, política ou economia..." oninput="filterNews()">
        </div>

        <main class="grid" id="news-grid"></main>
        <div id="loading" style="text-align:center; padding: 50px; color: var(--text-muted);">
            <i class="fas fa-spinner fa-spin"></i> Sincronizando com as principais fontes...
        </div>
    </div>
</div>

<div id="article-view">
    <div class="article-header-nav">
        <button class="btn-round" onclick="closeArticle()"><i class="fas fa-arrow-left"></i></button>
        <div style="display:flex; gap: 10px;">
            <button class="btn-round" onclick="shareArticle()"><i class="fas fa-share-alt"></i></button>
            <button class="btn-round" id="fav-btn" onclick="toggleFav()"><i class="far fa-heart"></i></button>
        </div>
    </div>
    <div id="article-full-content"></div>
</div>

<script>
const SOURCES = [
    { name: "O País", api: "https://opais.co.mz/wp-json/wp/v2/posts?_embed", slug: "opais" },
    { name: "Carta de MZ", api: "https://cartamz.com/wp-json/wp/v2/posts?_embed", slug: "carta" },
    { name: "MZ News", api: "https://mznews.co.mz/wp-json/wp/v2/posts?_embed", slug: "mznews" },
    { name: "Folha de Maputo", api: "https://www.folhademaputo.co.mz/wp-json/wp/v2/posts?_embed", slug: "folha" },
    { name: "Integrity Mag", api: "https://integritymagazine.co.mz/wp-json/wp/v2/posts?_embed", slug: "integrity" }
];

let allPosts = [];
let currentPost = null;
let sliderAutoPlay;

async function fetchAllNews() {
    for (const source of SOURCES) {
        try {
            const res = await fetch(`${source.api}&per_page=10`);
            const data = await res.json();
            data.forEach(p => {
                const uniqueId = `${source.slug}-${p.id}`;
                if(!allPosts.some(x => x.id === uniqueId)) {
                    allPosts.push({
                        id: uniqueId,
                        title: p.title.rendered,
                        content: p.content.rendered,
                        img: p._embedded['wp:featuredmedia']?.[0].source_url || 'https://via.placeholder.com/800x500',
                        source: source.name,
                        link: p.link,
                        date: p.date
                    });
                }
            });
        } catch (e) { console.error("Erro na fonte:", source.name); }
    }
    allPosts.sort((a,b) => new Date(b.date) - new Date(a.date));
    renderAll();
    checkDeepLink();
}

function renderAll() {
    document.getElementById('loading').style.display = 'none';
    renderSlider();
    renderGrid(allPosts);
}

function renderSlider() {
    const track = document.getElementById('slider-track');
    const top10 = allPosts.slice(0, 10);
    track.innerHTML = top10.map(p => `
        <div class="slide" onclick="openArticle('${p.id}')">
            <img src="${p.img}">
            <div class="slide-content">
                <span class="slide-tag">${p.source}</span>
                <h2 class="slide-title">${p.title}</h2>
            </div>
        </div>
    `).join('');

    startSlider();
}

function startSlider() {
    let idx = 0;
    clearInterval(sliderAutoPlay);
    sliderAutoPlay = setInterval(() => {
        idx = (idx + 1) % 10;
        document.getElementById('slider-track').style.transform = `translateX(-${idx * 100}%)`;
    }, 5000);
}

function renderGrid(posts) {
    const grid = document.getElementById('news-grid');
    grid.innerHTML = posts.map(p => `
        <div class="card reveal-article" onclick="openArticle('${p.id}')">
            <img class="card-img" src="${p.img}" alt="News">
            <div class="card-body">
                <span class="card-tag">${p.source}</span>
                <h3 class="card-title">${p.title}</h3>
            </div>
        </div>
    `).join('');
}

function openArticle(id) {
    const post = allPosts.find(p => p.id === id);
    if(!post) return;
    currentPost = post;
    
    // Atualiza URL sem recarregar para permitir partilha profunda
    const newUrl = window.location.origin + window.location.pathname + `?noticia=${id}`;
    window.history.pushState({ path: newUrl }, '', newUrl);

    const view = document.getElementById('article-view');
    document.getElementById('article-full-content').innerHTML = `
        <img class="article-hero-img" src="${post.img}">
        <div class="article-content-wrap reveal-article">
            <span class="slide-tag" style="background:var(--accent)">${post.source}</span>
            <h1 class="article-title-big">${post.title}</h1>
            <div class="article-text">${post.content}</div>
            <a href="${post.link}" target="_blank" style="display:block; margin-top:40px; color:var(--primary); font-weight:700; text-decoration:none;">
                <i class="fas fa-external-link-alt"></i> Ver original em ${post.source}
            </a>
        </div>
    `;
    view.style.display = 'block';
    document.body.style.overflow = 'hidden';
}

function closeArticle() {
    document.getElementById('article-view').style.display = 'none';
    document.body.style.overflow = 'auto';
    // Remove o parâmetro da URL ao fechar
    const cleanUrl = window.location.origin + window.location.pathname;
    window.history.pushState({ path: cleanUrl }, '', cleanUrl);
}

function shareArticle() {
    if(!currentPost) return;
    // O SEGREDO: Criamos o link para o SEU portal
    const shareUrl = window.location.href; 
    const shareTitle = currentPost.title;

    if (navigator.share) {
        navigator.share({ title: shareTitle, url: shareUrl });
    } else {
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareTitle + " - " + shareUrl)}`);
    }
}

function checkDeepLink() {
    const params = new URLSearchParams(window.location.search);
    const noticiaId = params.get('noticia');
    if(noticiaId) {
        // Se a notícia ainda não carregou, tentamos buscar especificamente
        const post = allPosts.find(p => p.id === noticiaId);
        if(post) openArticle(noticiaId);
    }
}

function toggleTheme() {
    const isDark = document.body.classList.toggle('dark-mode');
    document.getElementById('theme-icon').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

function filterNews() {
    const query = document.getElementById('search-input').value.toLowerCase();
    const filtered = allPosts.filter(p => p.title.toLowerCase().includes(query));
    renderGrid(filtered);
}

// Inicialização
window.onload = () => {
    if(localStorage.getItem('theme') === 'dark') toggleTheme();
    fetchAllNews();
};

// Fechar com a tecla ESC
window.onkeydown = (e) => { if(e.key === "Escape") closeArticle(); };
</script>

</body>
</html>
