<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <script type="text/javascript">
        aclib.runAutoTag({ zoneId: 'yzsgymrssb' });
    </script>
    <script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff" id="theme-color-meta">
    
    <title>Sua Notícia 365 | Premium App</title>

    <meta id="og-title" property="og:title" content="Sua Notícia 365 | Portal Premium">
    <meta id="og-image" property="og:image" content="https://via.placeholder.com/1200x630/cc0000/ffffff?text=Sua+Noticia+365">
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #991b1b; 
            --accent: #0f172a;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --text-meta: #64748b;
            --border: #e2e8f0;
            --surface: #ffffff;
            --shadow-app: 0 -10px 30px rgba(0, 0, 0, 0.05);
            --shadow-card: 0 8px 20px rgba(0, 0, 0, 0.04);
            --font-ui: 'Plus Jakarta Sans', sans-serif;
            --font-serif: 'Playfair Display', serif;
            --nav-height: 70px;
        }

        body.dark-mode {
            --bg: #020617;
            --card: #0f172a;
            --text: #f8fafc;
            --text-meta: #94a3b8;
            --border: #1e293b;
            --surface: #0f172a;
            --primary: #ef4444;
            --shadow-app: 0 -10px 30px rgba(0, 0, 0, 0.5);
            --shadow-card: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: var(--font-ui); background: var(--bg); color: var(--text); overflow-x: hidden; padding-bottom: calc(var(--nav-height) + 20px); transition: background 0.3s ease; }
        
        .app-view { display: none; width: 100%; min-height: 100vh; animation: fadeIn 0.4s ease forwards; }
        .app-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Top App Bar */
        .app-header { position: sticky; top: 0; background: rgba(var(--bg), 0.95); backdrop-filter: blur(10px); z-index: 1000; border-bottom: 1px solid var(--border); }
        .app-header-inner { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 10px 20px; height: 65px; }
        .logo { font-family: var(--font-serif); font-weight: 900; font-size: 1.5rem; color: var(--text); text-decoration: none; text-transform: uppercase; letter-spacing: -0.5px; }
        .logo span { color: var(--primary); }
        .icon-btn { background: var(--surface); border: 1px solid var(--border); font-size: 1.2rem; color: var(--text); cursor: pointer; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: 0.2s; box-shadow: var(--shadow-card); }

        .breaking-bar { background: var(--text); color: var(--bg); padding: 5px 20px; font-size: 0.7rem; font-weight: 700; overflow: hidden; white-space: nowrap; text-transform: uppercase; letter-spacing: 1px; }
        .breaking-text { animation: scrollLeft 30s linear infinite; display: inline-block; padding-left: 100%; }
        @keyframes scrollLeft { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* Pesquisa */
        .search-container { max-width: 1200px; margin: 15px auto; padding: 0 15px; }
        .search-box { position: relative; }
        .search-box input { width: 100%; padding: 14px 15px 14px 45px; border-radius: 14px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 1rem; font-family: var(--font-ui); outline: none; font-weight: 500; box-shadow: var(--shadow-card); transition: 0.3s; }
        .search-box input:focus { border-color: var(--primary); }
        .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-meta); }

        /* Slider */
        .hero-slider { max-width: 1200px; margin: 0 auto 20px; padding: 0 15px; position: relative; }
        .slider-viewport { overflow: hidden; border-radius: 20px; height: 350px; position: relative; box-shadow: var(--shadow-card); }
        .slider-track { display: flex; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); height: 100%; }
        .slide { min-width: 100%; position: relative; cursor: pointer; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }
        .slide-content { position: absolute; bottom: 0; left: 0; width: 100%; padding: 60px 20px 25px; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); color: white; }
        .slide-tag { background: var(--primary); color: white; padding: 5px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; margin-bottom: 12px; display: inline-block; }
        .slide-title { font-family: var(--font-serif); font-size: 1.6rem; line-height: 1.2; font-weight: 900; }

        /* Grelha Feed */
        .feed { padding: 0 15px; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .news-card { background: var(--card); border-radius: 18px; border: 1px solid var(--border); overflow: hidden; cursor: pointer; display: flex; flex-direction: column; box-shadow: var(--shadow-card); transition: transform 0.3s, box-shadow 0.3s; animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .news-card:active { transform: scale(0.98); }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.95) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        
        .news-img { width: 100%; height: 200px; object-fit: cover; }
        .news-body { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; }
        .news-tag { color: var(--text); background: var(--bg); padding: 5px 10px; border-radius: 6px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; margin-bottom: 12px; border: 1px solid var(--border); width: fit-content; }
        .news-title { font-family: var(--font-serif); font-size: 1.2rem; font-weight: 800; line-height: 1.4; color: var(--text); margin-bottom: 15px; }
        .news-meta { font-size: 0.8rem; color: var(--text-meta); margin-top: auto; display: flex; align-items: center; font-weight: 600; border-top: 1px solid var(--border); padding-top: 12px; gap: 6px; }

        /* Artigo View */
        #article-view { position: fixed; inset: 0; background: var(--bg); z-index: 3000; overflow-y: auto; padding-bottom: 80px; }
        .article-header { position: sticky; top: 0; background: rgba(var(--bg), 0.95); backdrop-filter: blur(15px); display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; z-index: 100; border-bottom: 1px solid var(--border); }
        
        .article-container { max-width: 800px; margin: 0 auto; padding: 25px 20px; background: var(--card); min-height: 100vh; }
        .article-tag { display: inline-block; background: var(--primary); color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; margin-bottom: 18px; }
        .article-title { font-family: var(--font-serif); font-size: 2.2rem; font-weight: 900; line-height: 1.2; margin-bottom: 25px; color: var(--text); }
        
        .article-actions-bar { display: flex; justify-content: center; gap: 30px; padding: 15px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: 30px; background: var(--surface); border-radius: 12px; }
        .action-icon { background: none; border: none; color: var(--text-meta); font-size: 1.3rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 0.75rem; font-family: var(--font-ui); font-weight: 700; transition: 0.2s; }
        .action-icon.active { color: var(--primary); transform: scale(1.1); }
        .action-icon i { font-size: 1.5rem; }

        .article-main-img { width: 100%; border-radius: 16px; margin-bottom: 30px; object-fit: cover; max-height: 400px; box-shadow: var(--shadow-card); }
        .article-content { font-size: 1.1rem; line-height: 1.8; color: var(--text); }
        .article-content img { max-width: 100%; border-radius: 12px; margin: 20px 0; height: auto; }

        /* Botões Animados Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height); background: rgba(var(--surface), 0.95); backdrop-filter: blur(15px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 2000; box-shadow: var(--shadow-app); padding-bottom: env(safe-area-inset-bottom); transition: 0.3s transform; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-meta); font-size: 0.7rem; font-weight: 700; cursor: pointer; flex: 1; height: 100%; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .nav-item i { font-size: 1.4rem; margin-bottom: 4px; transition: 0.3s; }
        .nav-item.active { color: var(--primary); transform: translateY(-5px); }
        .nav-item.active i { transform: scale(1.2); }

        /* FAB - Seta Flutuante Inteligente */
        .scroll-fab { position: fixed; right: 20px; bottom: calc(var(--nav-height) + 20px); width: 50px; height: 50px; border-radius: 50%; background: var(--primary); color: white; border: none; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(153, 27, 27, 0.4); transition: 0.3s; z-index: 1500; }
        .scroll-fab:active { transform: scale(0.9); }

        /* Loading */
        .loader { text-align: center; padding: 40px; color: var(--text-meta); font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; }

        @media (min-width: 768px) {
            .bottom-nav { display: none; }
            body { padding-bottom: 0; }
            .scroll-fab { bottom: 30px; }
            .article-title { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

<header class="app-header" id="main-header">
    <div class="app-header-inner">
        <a href="javascript:void(0)" class="logo" onclick="switchTab('home')">Notícia<span>365</span></a>
        <button class="icon-btn" onclick="toggleTheme()"><i class="fas fa-moon" id="theme-icon-top"></i></button>
    </div>
    <div class="breaking-bar">
        <div class="breaking-text" id="breaking-ticker">Sincronizando de forma contínua com os principais jornais de Moçambique...</div>
    </div>
</header>

<div id="home-view" class="app-view active">
    <div class="search-container">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" placeholder="Pesquisar manchetes..." oninput="localInstantSearch()">
        </div>
    </div>

    <div class="hero-slider" id="hero-slider" style="display: none;">
        <div class="slider-viewport">
            <div class="slider-track" id="slider-track"></div>
        </div>
    </div>

    <main class="feed" id="feed"></main>
    <div id="scroll-anchor" class="loader"><i class="fas fa-circle-notch fa-spin"></i> Atualizando notícias em tempo real...</div>
</div>

<div id="lists-view" class="app-view">
    <div class="search-container" style="padding-top: 10px;">
        <h2 style="font-family: var(--font-serif); margin-bottom: 15px; color: var(--text);" id="list-title">Ler Mais Tarde</h2>
        <main class="feed" id="list-feed" style="padding: 0;"></main>
    </div>
</div>

<div id="article-view" class="app-view">
    <div class="article-header">
        <button class="icon-btn" onclick="goBackHistory()"><i class="fas fa-arrow-left"></i></button>
        <button class="icon-btn" style="background: transparent; border: none; box-shadow: none;" onclick="shareGlobal()"><i class="fas fa-share-nodes"></i></button>
    </div>
    
    <main class="article-container">
        <div id="source-tag" class="article-tag">...</div>
        <h1 id="article-title" class="article-title">...</h1>
        
        <div class="article-actions-bar">
            <button class="action-icon" id="btn-like" onclick="toggleLike()"><i class="fas fa-heart"></i> Favorito</button>
            <button class="action-icon" id="btn-save" onclick="toggleSaveArticle()"><i class="fas fa-bookmark"></i> Guardar</button>
            <button class="action-icon" id="btn-original"><i class="fas fa-external-link-alt"></i> Visitar Site</button>
        </div>

        <img id="feat-img" class="article-main-img" src="" style="display:none">
        <div id="article-content" class="article-content"></div>

        <div style="margin-top: 50px; border-top: 2px solid var(--border); padding-top: 30px;" id="related-section">
            <h3 style="font-family: var(--font-serif); margin-bottom: 20px; font-size: 1.8rem;">Continue a Ler</h3>
            <div class="feed" id="related-grid" style="padding: 0;"></div>
        </div>
    </main>
</div>

<nav class="bottom-nav" id="bottom-nav">
    <div class="nav-item active" onclick="switchTab('home', this)">
        <i class="fas fa-layer-group"></i>
        <span>Explorar</span>
    </div>
    <div class="nav-item" onclick="switchTab('saved', this)">
        <i class="fas fa-bookmark"></i>
        <span>Guardados</span>
    </div>
    <div class="nav-item" onclick="switchTab('liked', this)">
        <i class="fas fa-heart"></i>
        <span>Favoritos</span>
    </div>
</nav>

<button class="scroll-fab" id="scroll-fab" onclick="handleScrollFab()">
    <i class="fas fa-arrow-down"></i>
</button>

<script>
// TODAS AS 26 FONTES
const SOURCES = [
    { name: "O País", api: "https://opais.co.mz/wp-json/wp/v2/posts?_embed", slug: "opais" },
    { name: "Carta de MZ", api: "https://cartamz.com/wp-json/wp/v2/posts?_embed", slug: "carta" },
    { name: "MZ News", api: "https://mznews.co.mz/wp-json/wp/v2/posts?_embed", slug: "mznews" },
    { name: "Folha de Maputo", api: "https://www.folhademaputo.co.mz/wp-json/wp/v2/posts?_embed", slug: "folha" },
    { name: "Evidências", api: "https://evidencias.co.mz/wp-json/wp/v2/posts?_embed", slug: "evidencias" },
    { name: "Integrity Mag", api: "https://integritymagazine.co.mz/wp-json/wp/v2/posts?_embed", slug: "integrity" },
    { name: "Savana", api: "https://savana.co.mz/wp-json/wp/v2/posts?_embed", slug: "savana" },
    { name: "AIM News", api: "https://aimnews.org/wp-json/wp/v2/posts?_embed", slug: "aim" },
    { name: "Jornal Notícias", api: "https://www.jornalnoticias.co.mz/wp-json/wp/v2/posts?_embed", slug: "noticias" },
    { name: "Diário Económico", api: "https://www.diarioeconomico.co.mz/wp-json/wp/v2/posts?_embed", slug: "diario" },
    { name: "Times de Todos", api: "https://www.timesdetodos.com/wp-json/wp/v2/posts?_embed", slug: "timesdetodos" },
    { name: "360 Mozambique", api: "https://360mozambique.com/wp-json/wp/v2/posts?_embed", slug: "360moz" },
    { name: "O Económico", api: "https://www.oeconomico.com/wp-json/wp/v2/posts?_embed", slug: "oeconomico" },
    { name: "Club of Moz", api: "https://clubofmozambique.com/wp-json/wp/v2/posts?_embed", slug: "clubmz" },
    { name: "Ikweli", api: "https://ikweli.co.mz/wp-json/wp/v2/posts?_embed", slug: "ikweli" },
    { name: "Jornal Rigor", api: "https://jornalrigor.co.mz/wp-json/wp/v2/posts?_embed", slug: "rigor" },
    { name: "Jornal Desafio", api: "https://www.jornaldesafio.co.mz/wp-json/wp/v2/posts?_embed", slug: "desafio" },
    { name: "Canal de Moz", api: "https://canal.co.mz/wp-json/wp/v2/posts?_embed", slug: "canal" },
    { name: "Wamphula Fax", api: "https://www.wamphulafax.co.mz/wp-json/wp/v2/posts?_embed", slug: "wamphula" },
    { name: "Moz Times", api: "https://moztimes.com/wp-json/wp/v2/posts?_embed", slug: "moztimes" },
    { name: "Zumbo FM", api: "https://zumbofm.com/wp-json/wp/v2/posts?_embed", slug: "zumbo" },
    { name: "Zitamar", api: "https://www.zitamar.com/wp-json/wp/v2/posts?_embed", slug: "zitamar" },
    { name: "Chuabo FM", api: "https://chuabofm.com/wp-json/wp/v2/posts?_embed", slug: "chuabo" },
    { name: "CDD Moz", api: "https://cddmoz.org/wp-json/wp/v2/posts?_embed", slug: "cdd" },
    { name: "CIP Moz", api: "https://www.cipmoz.org/wp-json/wp/v2/posts?_embed", slug: "cip" },
    { name: "PDecide", api: "https://pdecide.org/wp-json/wp/v2/posts?_embed", slug: "pdecide" }
];

let allPosts = [], currentPage = 1, isFetching = false;
let currentReadingPost = null, homeScrollPos = 0;
let sliderInterval;

function extractImage(p) {
    if (p._embedded && p._embedded['wp:featuredmedia']) return p._embedded['wp:featuredmedia'][0].source_url;
    if (p.yoast_head_json && p.yoast_head_json.og_image) return p.yoast_head_json.og_image[0].url;
    return 'https://via.placeholder.com/800x500/1e293b/ffffff?text=Noticia+365';
}

function timeAgo(date) {
    const diff = Math.floor((new Date() - new Date(date)) / 1000);
    if (diff < 3600) return `${Math.floor(diff/60)} min atrás`;
    if (diff < 86400) return `${Math.floor(diff/3600)}h atrás`;
    return new Date(date).toLocaleDateString('pt-MZ');
}

// LÓGICA DE CARREGAMENTO INSTANTÂNEO (PROGRESSIVO)
function loadNewsProgressive() {
    if (isFetching) return;
    isFetching = true;
    document.getElementById('scroll-anchor').style.display = 'flex';

    let requestsDone = 0;

    SOURCES.forEach(src => {
        fetch(`${src.api}&per_page=6&page=${currentPage}`, { signal: AbortSignal.timeout(8000) })
        .then(res => res.ok ? res.json() : [])
        .then(data => {
            let added = false;
            data.forEach(p => {
                const id = `${src.slug}-${p.id}`;
                if (!allPosts.some(x => x.id === id)) {
                    allPosts.push({
                        id, title: p.title.rendered, content: p.content?.rendered || "",
                        img: extractImage(p), source: src.name, link: p.link, date: p.date
                    });
                    added = true;
                }
            });

            // Re-renderiza IMEDIATAMENTE assim que uma fonte chega (Efeito Cachoeira)
            if (added) {
                allPosts.sort((a,b) => new Date(b.date) - new Date(a.date));
                renderFeed();
                if(currentPage === 1) { buildSlider(); updateTicker(); }
            }
        })
        .catch(() => {}) // Ignora falhas de CORS/Offline de forma silenciosa
        .finally(() => {
            requestsDone++;
            if (requestsDone === SOURCES.length) {
                isFetching = false;
                currentPage++;
                document.getElementById('scroll-anchor').style.display = 'none';
            }
        });
    });
}

function renderFeed() {
    const feed = document.getElementById('feed');
    
    allPosts.forEach((p, idx) => {
        let card = document.getElementById(`card-${p.id}`);
        if(!card) {
            card = document.createElement('div');
            card.id = `card-${p.id}`;
            card.className = 'news-card';
            card.onclick = () => openArticle(p.id);
            card.innerHTML = `
                <img class="news-img" src="${p.img}" loading="lazy">
                <div class="news-body">
                    <span class="news-tag">${p.source}</span>
                    <h3 class="news-title">${p.title}</h3>
                    <div class="news-meta"><i class="far fa-clock"></i> ${timeAgo(p.date)}</div>
                </div>`;
            feed.appendChild(card);
        }
        // Assegura a ordem correta sem apagar elementos
        if(feed.children[idx] !== card) feed.insertBefore(card, feed.children[idx]);
    });
}

function buildSlider() {
    const track = document.getElementById('slider-track');
    const top10 = allPosts.slice(0, 10);
    if(top10.length === 0) return;

    document.getElementById('hero-slider').style.display = 'block';
    track.innerHTML = top10.map(p => `
        <div class="slide" onclick="openArticle('${p.id}')">
            <img src="${p.img}">
            <div class="slide-content">
                <span class="slide-tag">${p.source}</span>
                <h2 class="slide-title">${p.title}</h2>
            </div>
        </div>`).join('');

    let idx = 0;
    clearInterval(sliderInterval);
    sliderInterval = setInterval(() => {
        idx = (idx + 1) % top10.length;
        track.style.transform = `translateX(-${idx * 100}%)`;
    }, 4000);
}

function updateTicker() {
    if(allPosts.length > 0) {
        document.getElementById('breaking-ticker').innerHTML = allPosts.slice(0, 8).map(p => `<span style="color:var(--primary);">${p.source}</span> ${p.title}`).join(" &nbsp; • &nbsp; ");
    }
}

// LÓGICA DE HISTÓRICO SEQUENCIAL
function openArticle(id, isHistoryPop = false) {
    let post = allPosts.find(p => p.id === id) || 
               JSON.parse(localStorage.getItem('news_saved_365')||'[]').find(p => p.id===id) || 
               JSON.parse(localStorage.getItem('news_liked_365')||'[]').find(p => p.id===id);
    
    if(!post) return;

    // Se estivermos a abrir a partir da Home, salva o Scroll da Home
    if (!document.getElementById('article-view').classList.contains('active')) {
        homeScrollPos = window.scrollY;
    }

    currentReadingPost = post;

    // Se não for um botão "Voltar" do navegador, adiciona ao histórico
    if (!isHistoryPop) {
        history.pushState({ view: 'article', id: post.id }, "", "?noticia=" + post.id);
    }

    document.getElementById('source-tag').innerText = post.source;
    document.getElementById('article-title').innerHTML = post.title;
    document.getElementById('feat-img').src = post.img;
    document.getElementById('feat-img').style.display = 'block';
    document.getElementById('article-content').innerHTML = post.content;
    document.getElementById('btn-original').onclick = () => window.open(post.link, '_blank');

    updateActionBtns();
    
    // Notícias relacionadas (Renderizadas como o Feed Normal)
    const grid = document.getElementById('related-grid');
    grid.innerHTML = allPosts.filter(r => r.id !== post.id).slice(0, 6).map(r => `
        <div class="news-card" onclick="openArticle('${r.id}')" style="box-shadow:none;">
            <img class="news-img" src="${r.img}" style="height:140px;">
            <div class="news-body"><h4 class="news-title" style="font-size:1rem;">${r.title}</h4></div>
        </div>`).join('');

    document.getElementById('article-view').classList.add('active');
    document.getElementById('bottom-nav').style.transform = 'translateY(100%)'; 
    document.getElementById('scroll-fab').style.display = 'none'; // Esconde FAB no artigo
    
    document.getElementById('article-view').scrollTo(0,0);
}

// Botão "Voltar" Customizado - Força o Back do Navegador para manter a ordem
function goBackHistory() {
    window.history.back();
}

// Evento que escuta as mudanças de histórico (Voltar no Telefone ou no Botão)
window.addEventListener('popstate', (e) => {
    if (e.state && e.state.view === 'article') {
        // Volta para um artigo anterior na sequência
        openArticle(e.state.id, true);
    } else {
        // Volta para a Home
        document.getElementById('article-view').classList.remove('active');
        document.getElementById('bottom-nav').style.transform = 'translateY(0)';
        document.getElementById('scroll-fab').style.display = 'flex';
        currentReadingPost = null;
        window.scrollTo({ top: homeScrollPos, behavior: 'instant' });
    }
});

// Ações Padrão
function switchTab(tabId, element = null) {
    if(element) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
    }
    document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
    
    if(tabId === 'home') {
        document.getElementById('home-view').classList.add('active');
        document.getElementById('main-header').style.display = 'block';
    } else if (tabId === 'saved' || tabId === 'liked') {
        document.getElementById('lists-view').classList.add('active');
        document.getElementById('main-header').style.display = 'none';
        document.getElementById('list-title').innerText = tabId === 'saved' ? 'Ler Mais Tarde' : 'Favoritos';
        
        const list = JSON.parse(localStorage.getItem(tabId === 'saved' ? 'news_saved_365' : 'news_liked_365') || '[]');
        const feed = document.getElementById('list-feed');
        feed.innerHTML = list.length === 0 ? '<p style="text-align:center; padding: 40px; color: var(--text-meta);">A lista está vazia.</p>' : '';
        list.forEach(p => {
            feed.innerHTML += `
                <div class="news-card" onclick="openArticle('${p.id}')">
                    <img class="news-img" src="${p.img}">
                    <div class="news-body"><span class="news-tag">${p.source}</span><h3 class="news-title">${p.title}</h3></div>
                </div>`;
        });
    }
    window.scrollTo(0,0);
}

function toggleSaveArticle() {
    if(!currentReadingPost) return;
    let saved = JSON.parse(localStorage.getItem('news_saved_365') || '[]');
    const idx = saved.findIndex(x => x.id === currentReadingPost.id);
    if(idx > -1) saved.splice(idx, 1); else saved.push(currentReadingPost);
    localStorage.setItem('news_saved_365', JSON.stringify(saved));
    updateActionBtns();
}

function toggleLike() {
    if(!currentReadingPost) return;
    let liked = JSON.parse(localStorage.getItem('news_liked_365') || '[]');
    const idx = liked.findIndex(x => x.id === currentReadingPost.id);
    if(idx > -1) liked.splice(idx, 1); else liked.push(currentReadingPost);
    localStorage.setItem('news_liked_365', JSON.stringify(liked));
    updateActionBtns();
}

function updateActionBtns() {
    if(!currentReadingPost) return;
    const isSaved = JSON.parse(localStorage.getItem('news_saved_365') || '[]').some(x => x.id === currentReadingPost.id);
    const isLiked = JSON.parse(localStorage.getItem('news_liked_365') || '[]').some(x => x.id === currentReadingPost.id);
    document.getElementById('btn-save').classList.toggle('active', isSaved);
    document.getElementById('btn-like').classList.toggle('active', isLiked);
}

function localInstantSearch() {
    const q = document.getElementById('search-input').value.toLowerCase();
    Array.from(document.getElementById('feed').children).forEach(c => {
        const title = c.querySelector('.news-title').innerText.toLowerCase();
        c.style.display = title.includes(q) ? 'flex' : 'none';
    });
}

function toggleTheme() {
    const isDark = document.body.classList.toggle('dark-mode');
    document.getElementById('theme-icon-top').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
    document.getElementById('theme-color-meta').setAttribute("content", isDark ? "#020617" : "#f8fafc");
}

function shareGlobal() {
    if(!currentReadingPost) return;
    if(navigator.share) navigator.share({ title: currentReadingPost.title, url: window.location.href });
    else window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(currentReadingPost.title + " " + window.location.href)}`);
}

// Botão Flutuante (Scroll Direcional)
function handleScrollFab() {
    if (window.scrollY > 500) {
        window.scrollTo({ top: 0, behavior: 'smooth' }); // Sobe
    } else {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); // Desce
    }
}

window.addEventListener('scroll', () => {
    const fab = document.getElementById('scroll-fab');
    if (window.scrollY > 500) {
        fab.innerHTML = '<i class="fas fa-arrow-up"></i>';
    } else {
        fab.innerHTML = '<i class="fas fa-arrow-down"></i>';
    }
});

window.onload = () => {
    // Garante que a primeira página tem um estado no histórico
    history.replaceState({ view: 'home' }, "", window.location.pathname + window.location.search);

    const params = new URLSearchParams(window.location.search);
    if(params.get('noticia')) {
        const id = params.get('noticia');
        const src = SOURCES.find(s => s.slug === id.split('-')[0]);
        if(src) {
            fetch(`${src.api}&include=${id.split('-')[1]}`).then(r => r.json()).then(d => {
                if(d[0]) {
                    allPosts.push({ id, title: d[0].title.rendered, content: d[0].content.rendered, img: extractImage(d[0]), source: src.name, link: d[0].link, date: d[0].date });
                    openArticle(id, false);
                }
            });
        }
    }
    
    // Infinite Scroll
    const obs = new IntersectionObserver(e => { if(e[0].isIntersecting) loadNewsProgressive(); }, {rootMargin: "300px"});
    obs.observe(document.getElementById('scroll-anchor'));
    
    loadNewsProgressive();
};
</script>
